name: ci

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: bin/lint
          - name: typecheck
            run: bin/typecheck
          - name: test
            run: bin/test
          - name: build
            run: bin/build
          - name: e2e
            run: bin/e2e
            browsers: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: bin/setup
      - if: matrix.browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: ${{ matrix.run }}
