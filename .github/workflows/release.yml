# Each push to main updates release-please's release PRs, one per package.
# Merging one creates that package's release, and this workflow then publishes
# it. Publishing lives here rather than on a `release` event because releases
# created with the default GITHUB_TOKEN don't trigger other workflows. The
# trusted publishers on RubyGems and npm are pinned to this file name and the
# `release` environment; change either and publishing stops.

name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      gem: ${{ steps.release.outputs['ruby--release_created'] }}
      npm: ${{ steps.release.outputs['typescript--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release

  # release-please bumps the gem's version.rb and its entry in Gemfile.lock, but
  # not the lockfile's CHECKSUMS section, and CI installs the bundle in frozen
  # mode, so the gem's release PR needs `bundle lock` run on it to pass.
  lockfile:
    needs: release-please
    if: needs.release-please.outputs.gem != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: release-please--branches--main--components--rubocop-bottrall
    steps:
      - id: branch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "$BRANCH" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.branch.outputs.exists == 'true'
        with:
          ref: ${{ env.BRANCH }}
      - uses: ruby/setup-ruby@v1
        if: steps.branch.outputs.exists == 'true'
        with:
          working-directory: ruby
      - if: steps.branch.outputs.exists == 'true'
        working-directory: ruby
        run: bundle lock
      - if: steps.branch.outputs.exists == 'true'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Gemfile.lock to the new version"
          git push

  # The publish jobs can mint registry credentials, so they run none of the
  # packages' dev dependencies: the checks that need them run here, unprivileged.
  verify-gem:
    needs: release-please
    if: needs.release-please.outputs.gem == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ruby
          bundler-cache: true
      - run: bin/ci

  publish-gem:
    needs: [release-please, verify-gem]
    if: needs.release-please.outputs.gem == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ruby
          bundler-cache: false
      - run: gem build --quiet rubocop-bottrall.gemspec
      # RubyGems lets trusted publishing create a new gem only when the token
      # exchange names the account that will own it, and no release of
      # rubygems/configure-rubygems-credentials sends that `owner` yet.
      - name: Exchange the OIDC token for a RubyGems API key
        env:
          # bottrall's RubyGems.org user ID.
          RUBYGEMS_OWNER: "240211"
        shell: bash
        run: |
          jwt=$(curl -sS --fail-with-body -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r .value)
          response=$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt, owner: $owner}' |
            curl -sS -X POST -H "Content-Type: application/json" --data @- \
              https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)
          key=$(jq -r '.rubygems_api_key // empty' <<<"$response")
          if [[ -z $key ]]; then
            echo "::error::RubyGems refused the token exchange: ${response}"
            exit 1
          fi
          echo "::add-mask::${key}"
          echo "GEM_HOST_API_KEY=${key}" >> "$GITHUB_ENV"
      - run: gem push rubocop-bottrall-*.gem

  verify-npm:
    needs: release-please
    if: needs.release-please.outputs.npm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: typescript/.nvmrc
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: bin/ci

  # npm trusted publishing: npm exchanges the job's OIDC token itself and adds
  # provenance. It needs npm 11.5.1 or later.
  publish-npm:
    needs: [release-please, verify-npm]
    if: needs.release-please.outputs.npm == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: typescript/.nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: npm publish --access public
